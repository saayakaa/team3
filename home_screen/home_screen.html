<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>推しTask</title>
    <link rel="stylesheet" href="home_screen.css">
</head>
<body>

    <div class="container">
        
        <div class="title-area">

            <h1>推しTask</h1>
            <button class="setting-button">⚙️</button>

        </div>

    <div class="oshi-area">

        <div class="oshi-image">
            <img id="oshiImage" class="oshi-image" src="" alt="推し画像">
        </div>

        <label for="imageInput" class="image-button">
           📷画像変更
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            style="display:none;"
        >

    </div>

        <div class="level">
            Lv.1
        </div>

        <div class="exp-bar">
            <div class="exp-fill"></div>
        </div>

        <h2>やること</h2>

        <div class="task-area">

        </div>

        <div class="function_button">

            <button>✏️</button>

            <button>📋</button>

            <button>📅</button>

        </div>

    </div>


<script src="home_screen.js"></script>      <!-- JavaScriptを読み込む -->
</body>
</html>
